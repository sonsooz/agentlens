[project]
name = "agentlens"
version = "0.1.0"
description = "Lightweight observability SDK for multi-agent AI systems — see what every agent decided, called, and why it failed."
requires-python = ">=3.8"
dependencies = ["requests>=2.25"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
